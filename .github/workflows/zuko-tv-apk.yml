name: Build ZUKO TV APK

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ZUKO TV APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      HAS_KEYSTORE: ${{ secrets.ZUKO_KEYSTORE_BASE64 != '' }}
      HAS_RELEASE_SIGNING: ${{ secrets.ZUKO_KEYSTORE_PASSWORD != '' && secrets.ZUKO_KEY_ALIAS != '' && secrets.ZUKO_KEY_PASSWORD != '' }}
      TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
      STREAM_API_BASE: https://zuko-tv-streaming-production.up.railway.app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Locate preinstalled Android SDK
        shell: bash
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKM="$(find "$SDK/cmdline-tools" -path '*/bin/sdkmanager' 2>/dev/null | sort -V | tail -n1)"
          if [[ -z "$SDKM" ]]; then echo "sdkmanager not found under $SDK"; exit 1; fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKM")" >> "$GITHUB_PATH"

      - name: Accept Android SDK licenses
        shell: bash
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: Install Android SDK packages
        shell: bash
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Compute version
        shell: bash
        run: |
          echo "ZUKO_VERSION_CODE=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "ZUKO_VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "ZUKO_VERSION_NAME=0.1.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          fi

      - name: Build debug APK
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          STREAM_API_BASE: https://zuko-tv-streaming-production.up.railway.app
        run: |
          ./gradlew :app:assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Restore release keystore
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ZUKO_KEYSTORE_BASE64 }}
          ZUKO_KEYSTORE_PASSWORD: ${{ secrets.ZUKO_KEYSTORE_PASSWORD }}
          ZUKO_KEY_ALIAS: ${{ secrets.ZUKO_KEY_ALIAS }}
          ZUKO_KEY_PASSWORD: ${{ secrets.ZUKO_KEY_PASSWORD }}
        shell: bash
        run: |
          if [[ -z "${KEYSTORE_B64}" ]]; then
            echo "::error::ZUKO_KEYSTORE_BASE64 is empty."
            exit 1
          fi

          if [[ -z "${ZUKO_KEYSTORE_PASSWORD}" ]]; then
            echo "::error::ZUKO_KEYSTORE_PASSWORD is missing."
            exit 1
          fi

          if [[ -z "${ZUKO_KEY_ALIAS}" ]]; then
            echo "::error::ZUKO_KEY_ALIAS is missing."
            exit 1
          fi

          if [[ -z "${ZUKO_KEY_PASSWORD}" ]]; then
            echo "::error::ZUKO_KEY_PASSWORD is missing."
            exit 1
          fi

          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/zuko-release.jks"

          # Export both forms so Gradle can find them reliably
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/zuko-release.jks" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=${ZUKO_KEYSTORE_PASSWORD}" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=${ZUKO_KEY_ALIAS}" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=${ZUKO_KEY_PASSWORD}" >> "$GITHUB_ENV"

          echo "ZUKO_KEYSTORE_FILE=$RUNNER_TEMP/zuko-release.jks" >> "$GITHUB_ENV"
          echo "ZUKO_KEYSTORE_PASSWORD=${ZUKO_KEYSTORE_PASSWORD}" >> "$GITHUB_ENV"
          echo "ZUKO_KEY_ALIAS=${ZUKO_KEY_ALIAS}" >> "$GITHUB_ENV"
          echo "ZUKO_KEY_PASSWORD=${ZUKO_KEY_PASSWORD}" >> "$GITHUB_ENV"

      - name: Validate keystore
        if: env.HAS_KEYSTORE == 'true' && env.HAS_RELEASE_SIGNING == 'true'
        shell: bash
        run: |
          keytool -list -v \
            -keystore "$RUNNER_TEMP/zuko-release.jks" \
            -storepass "${{ secrets.ZUKO_KEYSTORE_PASSWORD }}" \
            -alias "${{ secrets.ZUKO_KEY_ALIAS }}" \
            >/dev/null
          echo "Keystore validated successfully."

      - name: Build signed release APK
        if: env.HAS_KEYSTORE == 'true' && env.HAS_RELEASE_SIGNING == 'true'
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          STREAM_API_BASE: https://zuko-tv-streaming-production.up.railway.app
          ZUKO_KEYSTORE_PASSWORD: ${{ secrets.ZUKO_KEYSTORE_PASSWORD }}
          ZUKO_KEY_ALIAS: ${{ secrets.ZUKO_KEY_ALIAS }}
          ZUKO_KEY_PASSWORD: ${{ secrets.ZUKO_KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease \
            --no-daemon \
            --stacktrace
